name: Bug report
description: Report a reproducible Healwright problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the locator, test code, and DOM change.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Healwright, Node.js, Playwright, Java, PostgreSQL, OS.
    validations:
      required: true
  - type: textarea
    id: reports
    attributes:
      label: Reports and logs
      description: Remove secrets and personal data before attaching output.

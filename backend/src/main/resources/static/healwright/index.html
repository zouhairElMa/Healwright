async function rwRunAction(kind, body, uid) {
  try {
    if (kind === 'apply') {
      const result = await rwFetch('/api/healwright/rewrite/apply', body);
      const n = Array.isArray(result.applied) ? result.applied.length : 0;
      await paintRewriteSection(uid);
      rwMsg(t('rw.written').replace('{n}', n).replace('{tx}', result.transactionId || '—'));
    } else {
      const result = await rwFetch('/api/healwright/rewrite/revert', body);
      const n = Array.isArray(result.restored) ? result.restored.length : 0;
      const c = Array.isArray(result.conflicts) ? result.conflicts.length : 0;
      await paintRewriteSection(uid);
      rwMsg(t('rw.restored').replace('{n}', n)
        + (c ? ' ' + t('rw.restoreConflicts').replace('{n}', c) : ''));
    }
  } catch (e) {
    rwMsg(t('error.backend') + ' : ' + e.message);
  }
}

function wireRewriteSection(uid) {
  RW_SESSION = null;
  const body = document.getElementById('rw-body');
  if (body) {
    body.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-rw-item]');
      if (!btn) return;
      const act = btn.getAttribute('data-rw-item');
      const id = btn.getAttribute('data-rw-id');
      const item = ((RW_SESSION && RW_SESSION.items) || []).find((i) => i.id === id) || {};
      if (act === 'apply') {
        if (item.status === 'unmeasured') {
          if (!window.confirm(t('rw.confirmApplyUnmeasured')
            .replace('{line}', item.measuredLine || '?'))) return;
        } else if (!window.confirm(t('rw.confirmApply').replace('{n}', 1))) return;
        void rwRunAction('apply', { ids: [id], includeManual: item.status === 'manual' }, uid);
      } else {
        if (!window.confirm(t('rw.confirmRestoreOne'))) return;
        void rwRunAction('revert', { ids: [id] }, uid);
      }
    });
  }
  const applyAll = document.getElementById('rw-apply-all');
  if (applyAll) {
    applyAll.addEventListener('click', () => {
      const n = (RW_SESSION && RW_SESSION.counts && RW_SESSION.counts.writable) || 0;
      if (n === 0) {
        rwMsg(t('rw.empty'));
        return;
      }
      if (!window.confirm(t('rw.confirmApply').replace('{n}', n))) return;
      void rwRunAction('apply', { sessionId: uid, all: true }, uid);
    });
  }
  const restoreAll = document.getElementById('rw-restore-all');
  if (restoreAll) {
    restoreAll.addEventListener('click', () => {
      const n = (RW_SESSION && RW_SESSION.counts && RW_SESSION.counts.applied) || 0;
      if (n === 0) {
        rwMsg(t('rw.empty'));
        return;
      }
      if (!window.confirm(t('rw.confirmRestore').replace('{n}', n))) return;
      void rwRunAction('revert', { scope: 'session', sessionId: uid }, uid);
    });
  }
  void paintRewriteSection(uid);
}

      const result = await rwFetch('/api/healwright/rewrite/revert', body);
      const n = Array.isArray(result.restored) ? result.restored.length : 0;
      const c = Array.isArray(result.conflicts) ? result.conflicts.length : 0;
      toast(t('rw.restored').replace('{n}', n)
        + (c ? ' ' + t('rw.restoreConflicts').replace('{n}', c) : ''));
    }
    await loadRewriteGlobal();
  } catch (e) {
    rwGlobalMsg(t('error.backend') + ' : ' + e.message);
  }
}

function wireRewriteGlobal() {
  const check = document.getElementById('rw-global-check');
  if (check) check.addEventListener('click', () => void loadRewriteGlobal());
  const apply = document.getElementById('rw-global-apply');
  if (apply) {
    apply.addEventListener('click', async () => {
      if (!RW_GLOBAL) await loadRewriteGlobal();
      const n = (RW_GLOBAL && RW_GLOBAL.counts && RW_GLOBAL.counts.writable) || 0;
      if (n === 0) {
        rwGlobalMsg(t('rw.empty'));
        return;
      }
      if (!window.confirm(t('rw.confirmApply').replace('{n}', n))) return;
      void rwGlobalAction('apply', { all: true });
    });
  }
  const restore = document.getElementById('rw-global-restore');
  if (restore) {
    restore.addEventListener('click', async () => {
      if (!RW_GLOBAL) await loadRewriteGlobal();
      const n = (RW_GLOBAL && RW_GLOBAL.counts && RW_GLOBAL.counts.applied) || 0;
      if (n === 0) {
        rwGlobalMsg(t('rw.empty'));
        return;
      }
      if (!window.confirm(t('rw.confirmRestore').replace('{n}', n))) return;
      void rwGlobalAction('revert', { scope: 'all' });
    });
  }
  const body = document.getElementById('rw-global-body');
  if (body) {
    body.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-rw-item]');
      if (!btn) return;
      const act = btn.getAttribute('data-rw-item');
      const id = btn.getAttribute('data-rw-id');
      const item = ((RW_GLOBAL && RW_GLOBAL.items) || []).find((i) => i.id === id) || {};
      if (act === 'apply') {
        if (item.status === 'unmeasured') {
          if (!window.confirm(t('rw.confirmApplyUnmeasured')
            .replace('{line}', item.measuredLine || '?'))) return;
        } else if (!window.confirm(t('rw.confirmApply').replace('{n}', 1))) return;
        void rwGlobalAction('apply', { ids: [id], includeManual: item.status === 'manual' });
      } else {
        if (!window.confirm(t('rw.confirmRestoreOne'))) return;
        void rwGlobalAction('revert', { ids: [id] });
      }
    });
  }
}

async function renderReport(uid) {
  document.getElementById('nav-selectors').classList.remove('active');
  document.getElementById('nav-reports').classList.add('active');
  view.innerHTML = '<div class="empty">' + esc(t('loading')) + '</div>';
  try {
    const [telemetry, persisted] = await Promise.all([
      telem(uid).catch(() => null),
      api('/healenium/report/data/' + encodeURIComponent(uid)).catch(() => null),
      loadMetas(),
    ]);
    const events = (telemetry && Array.isArray(telemetry.events)) ? telemetry.events : [];
    const attempts = buildAttempts(events);
    const s = summarizeAttempts(attempts);
    const records = (persisted && persisted.data) || [];
    const orphanCaptures = attachCaptures(attempts, records);
    const capturedCount = attempts.filter((a) => a.capture).length;
    const meta = metaOf(uid) || {};
    const testName = meta.testName || (persisted && persisted.name) || uid;
    const first = attempts[0] || null;
    const url = (first && first.url) || '';
    const replayFailures = events.filter((e) => e.event === 'replay.failed').length;
    const reasonCounts = {};
    attempts.filter((a) => a.kind === 'miss').forEach((a) => {
      reasonCounts[a.reason] = (reasonCounts[a.reason] || 0) + 1;
    });
    const reasonChips = Object.entries(reasonCounts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5)
      .map(([reason, count]) => '<span class="chip bad">' + esc(reasonLabel(reason)) +
        ' <b>' + count + '</b></span>').join('');
    const totals = {
      hideSessions: true, sessions: 1, attempts: s.attempts, healed: s.healed, missed: s.missed,
      skipped: s.skipped, successRate: s.successRate, avgScore: s.avgScore,
      avgDurationMs: s.avgDurationMs, replayFailed: replayFailures,
    };
    const verdict = s.attempts === 0
      ? t('detail.noAttempt')
      : t('detail.verdictText')
        .replace('{attempts}', s.attempts)
        .replace('{healed}', s.healed)
        .replace('{missed}', s.missed)
        .replace('{skipped}', s.skipped);
    view.innerHTML =
      '<div class="crumb"><a href="#/">← ' + esc(t('detail.back')) + '</a></div>' +
      '<header class="page-head"><div class="page-head-main">' +
        '<p class="eyebrow">Healwright · Reporting</p>' +
        '<h1>' + esc(testName) + (persisted ? ' <button id="rename" type="button">' + esc(t('detail.rename')) + '</button>' : '') + '</h1>' +
        '<div class="page-meta">' +
          '<span>' + esc(fmtTs(first ? first.ts : (persisted && persisted.time))) + '</span>' +
          '<span class="sep"></span>' +
          '<span>' + esc(t('detail.session')) + ' <code>' + esc(uid) + '</code></span>' +
          (meta.testFile ? '<span class="sep"></span><code>' + esc(shortFile(meta.testFile)) + '</code>' : '') +
          (url ? '<span class="sep"></span><span class="muted">' + esc(t('detail.url')) + ' : ' + esc(url) + '</span>' : '') +
        '</div>' +
      '</div></header>' +
      kpis(totals) +
      '<div class="story"><h3>' + esc(t('detail.verdict')) + '</h3><p>' + esc(verdict) + '</p>' +
        (reasonChips ? '<div class="chips">' + reasonChips + '</div>' : '') + '</div>' +
      '<div class="section"><h2>' + esc(t('detail.attempts')) + ' <span class="count">' + attempts.length +
        '</span>' + (capturedCount ? ' <span class="count">· ' + capturedCount + ' ' +
        esc(t('capture.tag')) + '</span>' : '') + '</h2>' +
        '<div class="toolbar"><label class="grow">' + esc(t('filter.search')) +
          ' <input type="search" id="a-search" placeholder="' + esc(t('detail.searchAttempt')) + '" /></label>' +
          '<div class="pill-group">' +
            '<button type="button" class="pill active" data-attempt-filter="all">' + esc(t('detail.filterAll')) + '</button>' +
            '<button type="button" class="pill" data-attempt-filter="ok">' + esc(t('detail.filterOk')) + '</button>' +
            '<button type="button" class="pill" data-attempt-filter="miss">' + esc(t('detail.filterMiss')) + '</button>' +
            '<button type="button" class="pill" data-attempt-filter="skip">' + esc(t('detail.filterSkip')) + '</button>' +
          '</div></div>' +
        '<div id="attempts-body">' + renderAttemptList(attempts) + '</div>' +
      '</div>' +
      '<div class="section" id="rw-section">' +
        '<h2>' + esc(t('rw.title')) + ' <span class="count" id="rw-count"></span></h2>' +
        '<p class="sub">' + esc(t('rw.hint')) + ' ' + esc(t('rw.hintAuto')) + '</p>' +
        '<div class="toolbar">' +
          '<button type="button" id="rw-apply-all">' + esc(t('rw.applyAll')) + '</button>' +
          '<button type="button" id="rw-restore-all">' + esc(t('rw.restoreAll')) + '</button>' +
          '<span class="muted" id="rw-msg"></span>' +
        '</div>' +
        '<div id="rw-body"></div>' +
      '</div>' +
      orphanCapturesSection(orphanCaptures) +
      '<details class="raw"><summary>' + esc(t('detail.raw')) + ' (' + events.length + ')</summary>' +
        '<div class="events">' + renderTelemetry(telemetry) + '</div></details>';
    wireAttemptFilters(attempts);
    wireReportActions(uid, records);
    wireRewriteSection(uid);
  } catch (e) {
    view.innerHTML = '<div class="empty err">' + esc(t('error.generic')) + ' : ' + esc(e.message) + '</div>';
  }
}

function wireAttemptFilters(attempts) {
  const bodyEl = document.getElementById('attempts-body');
  if (!bodyEl) return;
  const search = document.getElementById('a-search');
  const pills = [...document.querySelectorAll('[data-attempt-filter]')];
  const state = { q: '', kind: 'all' };
  const paint = () => {
    const q = state.q.trim().toLowerCase();
    const list = attempts.filter((a) => {
      if (state.kind !== 'all' && a.kind !== state.kind) return false;
      if (!q) return true;
      return [a.failed, a.healed, a.reason, reasonLabel(a.reason), a.url, a.method,
        a.candidates.map(candidateLocator).join(' ')]
        .some((v) => String(v || '').toLowerCase().includes(q));
    });
    bodyEl.innerHTML = renderAttemptList(list);
  };
  if (search) search.addEventListener('input', () => { state.q = search.value; paint(); });
  pills.forEach((p) => p.addEventListener('click', () => {
    state.kind = p.getAttribute('data-attempt-filter');
    pills.forEach((x) => x.classList.toggle('active', x === p));
    paint();
  }));
}

function renderTelemetry(telemetry) {
  if (!telemetry || !telemetry.events || telemetry.events.length === 0) {
    return '<div class="empty">' + esc(t('telem.empty')) + '</div>';
  }
  return telemetry.events.map((ev) => {
    const kind = ev.event === 'heal.miss' || ev.event === 'heal.skipped' ? 'miss'
      : (ev.event === 'replay.failed' || ev.event === 'action.failed' ? 'fail' : '');
    const parts = [];
    parts.push('<b>' + esc(ev.event) + '</b>');
    if (ev.reason) parts.push(esc(t('telem.reason')) + ' : ' + esc(ev.reason));
    if (ev.method) parts.push(esc(t('telem.method')) + ' : <code>' + esc(ev.method) + '</code>');
    if (ev.locator && !ev.playwright) parts.push(esc(t('telem.locator')) + ' : <code>' + esc(ev.locator.type) + '(' + esc(ev.locator.value) + ')</code>');
    if (ev.playwright) {
      parts.push(esc(t('telem.playwright')) + ' : <code>' + esc(ev.playwright.failed) + '</code>');
      if (ev.playwright.healed) parts.push(esc(t('telem.healed')) + ' : <code>' + esc(ev.playwright.healed) + '</code>');
    } else {
      if (ev.failedLocator) parts.push(esc(t('telem.failed')) + ' : <code>' + esc(ev.failedLocator.value) + '</code>');
      if (ev.healedLocator) parts.push(esc(t('telem.healed')) + ' : <code>' + esc(ev.healedLocator.value) + '</code> ' + esc(t('telem.score')) + ' ' + fmtScore(ev.score));
    }
    if (ev.score !== undefined && (ev.playwright || !ev.healedLocator)) {
      parts.push(esc(t('telem.score')) + ' : ' + fmtScore(ev.score));
    }
    if (ev.event === 'report.meta') {
      if (ev.testName) parts.push(esc(t('telem.test')) + ' : ' + esc(ev.testName));
      if (ev.testFile) parts.push(esc(t('telem.file')) + ' : <code>' + esc(shortFile(ev.testFile)) + '</code>');
    }
    if (ev.margin !== undefined) parts.push(esc(t('telem.margin')) + ' : ' + (ev.margin === null ? '—' : fmtScore(ev.margin)));
    if (ev.element) {
      const id = ev.element.id ? '#' + ev.element.id : '';
      const text = ev.element.text ? ' « ' + esc(ev.element.text) + ' »' : '';
      parts.push(esc(t('telem.element')) + ' : <code>' + esc(ev.element.tag + id) + '</code>' + text);
    }
    if (ev.durationMs !== undefined) parts.push(ev.durationMs + ' ' + esc(t('telem.ms')));
    if (ev.error) parts.push('<span class="err">' + esc(String(ev.error).split('\n')[0]) + '</span>');
    if (ev.candidates && ev.candidates.length) {
      parts.push('<br/>' + esc(t('telem.candidates')) + ' : ' + ev.candidates.map((c) => {
        const lcs = candidateLcs(c);
        const evTot = candidateEvidence(c);
        return '<code>' + esc(candidateLocator(c)) + '</code> ' +
          (lcs === null ? 'LCS —' : 'LCS ' + fmtScore(lcs)) +
          (evTot === null ? '' : ' · ' + esc(t('cand.evidence').toLowerCase()) + ' ' + evTot);
      }).join(' · '));
    }
    const unlinked = !ev.candidates || !ev.candidates.length || ev.candidates.some((c) => candidateLcs(c) === null);
    if (unlinked && ev.topScores && ev.topScores.length) {
      parts.push('<br/>' + esc(t('telem.topScores')) + ' : ' + ev.topScores.map((s) => fmtScore(s)).join(', '));
    }
    return '<div class="event ' + kind + '"><div class="t">' + esc(ev.ts) + '</div>' + parts.join(' — ') + '</div>';
  }).join('');
}

function wireReportActions(uid, recs) {
  const byId = new Map(recs.map((rec) => [String(rec.healingResultId), rec]));
  view.querySelectorAll('[data-shot]').forEach((img) => {
    img.addEventListener('click', () => showShot(img.getAttribute('data-shot')));
  });
  view.querySelectorAll('[data-success]').forEach((box) => {
    box.addEventListener('change', async () => {
      // Keyed by healingResultId: the checkbox now lives inside an attempt card, so an array
      // index would drift as soon as the attempts are filtered.
      const rec = byId.get(String(box.getAttribute('data-success')));
      if (!rec) return;
      try {
        await api('/healenium/healing/success', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ healingResultId: rec.healingResultId, successHealing: box.checked }),
        });
        renderReport(uid);
      } catch (e) { window.alert(t('error.generic') + ' : ' + e.message); }
    });
  });
  const rename = document.getElementById('rename');
  if (rename) rename.addEventListener('click', async () => {
    const name = window.prompt(t('prompt.rename'));
    if (!name) return;
    try {
      await api('/healenium/report/data/' + encodeURIComponent(uid), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ name }),
      });
      renderReport(uid);
    } catch (e) { window.alert(t('error.generic') + ' : ' + e.message); }
  });
}

async function renderSelectors() {
  document.getElementById('nav-selectors').classList.add('active');
  document.getElementById('nav-reports').classList.remove('active');
  view.innerHTML = '<header class="page-head"><div class="page-head-main">' +
    '<p class="eyebrow">Healwright · Reporting</p>' +
    '<h1>' + esc(t('selectors.title')) + '</h1></div></header>' +
    '<div id="sel-body"><div class="empty">' + esc(t('loading')) + '</div></div>';
  try {
    const list = await api('/healenium/selector/all');
    const body = document.getElementById('sel-body');
    if (!list.length) { body.innerHTML = '<div class="empty">' + esc(t('selectors.empty')) + '</div>'; return; }
    const enabled = list.filter((s) => s.enableHealing).length;
    body.innerHTML =
      '<div class="chips" style="margin-bottom:12px">' +
        '<span class="chip">' + esc(t('selectors.total')) + ' <b>' + list.length + '</b></span>' +
        '<span class="chip">' + esc(t('selectors.enabledCount')) + ' <b>' + enabled + '</b></span>' +
        '<span class="chip">' + esc(t('selectors.disabledCount')) + ' <b>' + (list.length - enabled) + '</b></span>' +
      '</div>' +
      '<div class="toolbar"><label class="grow">' + esc(t('filter.search')) +
        ' <input type="search" id="s-search" placeholder="' + esc(t('selectors.searchHint')) + '" /></label></div>' +
      tableWrap('<table id="selectors-table"><thead><tr><th>' + esc(t('th.locator')) + '</th><th>' +
        esc(t('th.classMethod')) + '</th><th>' + esc(t('th.command')) + '</th><th>' + esc(t('th.url')) +
        '</th><th>' + esc(t('th.enabled')) + '</th></tr></thead><tbody>' +
        list.map((s, i) => {
          const search = [s.locator, s.className, s.methodName, s.command, s.url]
            .map((v) => String(v || '')).join(' ').toLowerCase();
          return '<tr data-search="' + esc(search) + '">' +
            '<td><code>' + esc(s.locator) + '</code></td>' +
            '<td>' + esc(s.className) + '.' + esc(s.methodName) + '</td>' +
            '<td><span class="badge neutral">' + esc(s.command || t('selectors.na')) + '</span></td>' +
            '<td><a class="loc" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.url) + '</a></td>' +
            '<td><input type="checkbox" data-sel="' + i + '"' + (s.enableHealing ? ' checked' : '') + ' /></td>' +
            '</tr>';
        }).join('') + '</tbody></table>', 'scroll-table');
    const input = document.getElementById('s-search');
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      document.querySelectorAll('#selectors-table tbody tr').forEach((tr) => {
        tr.hidden = Boolean(q) && !(tr.getAttribute('data-search') || '').includes(q);
      });
    });
    body.querySelectorAll('[data-sel]').forEach((box) => {
      box.addEventListener('change', async () => {
        const s = list[Number(box.getAttribute('data-sel'))];
        try {
          await api('/healenium/selector/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ id: s.id, locator: s.locator, enableHealing: box.checked }),
          });
          renderSelectors();
        } catch (e) { window.alert(t('error.generic') + ' : ' + e.message); }
      });
    });
  } catch (e) {
    document.getElementById('sel-body').innerHTML = '<div class="empty err">' + esc(t('error.backend')) + ' : ' + esc(e.message) + '</div>';
  }
}

let lastHash = location.hash || '#/';
let listScrollY = 0;

async function route() {
  const hash = location.hash || '#/';
  const reportMatch = hash.match(/^#\/report\/(.+)$/);
  if (reportMatch && (lastHash === '' || lastHash === '#' || lastHash === '#/')) {
    listScrollY = window.scrollY;
  }
  lastHash = hash;
  if (reportMatch) { await renderReport(decodeURIComponent(reportMatch[1])); return; }
  if (hash.startsWith('#/selectors')) { listScrollY = 0; await renderSelectors(); return; }
  await renderReports();
  if (listScrollY) {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, Math.min(listScrollY, Math.max(0, max)));
    listScrollY = 0;
  }
}

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('hw-theme', theme); } catch (e) { /* ignore */ }
  const btn = document.getElementById('theme');
  const action = theme === 'dark' ? t('theme.light') : t('theme.dark');
  const label = document.getElementById('theme-label');
  if (label) label.textContent = action;
  btn.title = action;
  btn.setAttribute('aria-label', action);
  btn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
}
function applyLocale(lang) {
  LANG = supportedLocale(lang) || 'en';
  try { localStorage.setItem('hw-lang', LANG); } catch (e) { /* ignore */ }
  const root = document.documentElement;
  root.setAttribute('lang', LANG);
  if (LANG === 'ar') root.setAttribute('dir', 'rtl'); else root.removeAttribute('dir');
  document.getElementById('nav-reports').textContent = t('nav.reports');
  document.getElementById('nav-selectors').textContent = t('nav.selectors');
  document.getElementById('refresh-label').textContent = t('action.refresh');
  document.getElementById('refresh').title = t('action.refresh');
  document.getElementById('lang').value = LANG;
  document.getElementById('lang').setAttribute('aria-label', t('lang.label'));
  modalImg.alt = t('modal.alt');
  document.getElementById('db-label').textContent = t('clean.label');
  document.getElementById('db-manage').title = t('clean.title');
  document.getElementById('db-manage').setAttribute('aria-label', t('clean.title'));
  applyTheme(currentTheme());
  paintBackendBadge();
}
function paintBackendBadge() {
  document.getElementById('backend-badge').textContent = CFG.backend
    ? t('backend.label') + ' : ' + CFG.backend
    : t('backend.label') + ' : ?';
}
function buildLangSelect() {
  const sel = document.getElementById('lang');
  sel.innerHTML = LOCALES.map((l) =>
    '<option value="' + l.code + '">' + esc(l.label) + '</option>').join('');
  sel.value = LANG;
  sel.addEventListener('change', () => { applyLocale(sel.value); route(); });
}

window.addEventListener('hashchange', route);
document.getElementById('refresh').addEventListener('click', route);
document.getElementById('theme').addEventListener('click', () =>
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));

(async function init() {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  buildLangSelect();
  applyLocale(LANG);
  try {
    const res = await fetch(BASE + 'api/config');
    if (res.ok) {
      const cfg = await res.json();
      CFG = Object.assign({}, CFG, cfg);
    }
  } catch { /* keep defaults */ }
  // Only when the config endpoint is unreachable: the jar returns explicit "" for same-origin.
  if (typeof CFG.backendBase !== 'string') {
    CFG.backendBase = BASE === '/' ? '/backend' : '';
  }
  if (typeof CFG.telemetryBase !== 'string' || CFG.telemetryBase === '') {
    CFG.telemetryBase = BASE + 'api/telemetry';
  }
  paintBackendBadge();
  await refreshDbBadge();
  await route();
})();
</script>
